name: Build DoReMi APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 1. Android SDK 環境 ──────────────────────────────────────
      - name: Prepare Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          # Accept licenses silently
          yes | sdkmanager --licenses --sdk_root=$ANDROID_HOME 2>/dev/null || true
          # Ensure platform 34 and build-tools 34 exist
          sdkmanager --sdk_root=$ANDROID_HOME \
            "platforms;android-34" \
            "build-tools;34.0.0" 2>/dev/null || true
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      # ── 2. 取得 Gradle 8.4 ──────────────────────────────────────
      - name: Download Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          echo "GRADLE=/tmp/gradle-8.4/bin/gradle" >> $GITHUB_ENV

      # ── 3. 圖示 ────────────────────────────────────────────────
      - name: Prepare icons
        run: |
          for d in mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p app/src/main/res/$d
          done
          # 從已上線的 backend 下載圖示
          curl -sf -o /tmp/icon.png https://btryit123.zeabur.app/icons/icon-512.png \
            || convert -size 192x192 xc:#9333ea /tmp/icon.png
          for d in mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp /tmp/icon.png app/src/main/res/$d/ic_launcher.png
            cp /tmp/icon.png app/src/main/res/$d/ic_launcher_round.png
          done

      # ── 4. Keystore ────────────────────────────────────────────
      - name: Prepare keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
            echo "KS_PASS=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"        >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.KEY_PASSWORD }}"      >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore app/release.keystore -alias doremi-ktv \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=DoReMi KTV, O=DoReMi, C=TW" \
              -storepass doremi123 -keypass doremi123 2>/dev/null
            echo "KS_PASS=doremi123"   >> $GITHUB_ENV
            echo "KEY_ALIAS=doremi-ktv" >> $GITHUB_ENV
            echo "KEY_PASS=doremi123"   >> $GITHUB_ENV
          fi

      - name: Print SHA-256 fingerprint
        run: |
          echo "=== SHA-256 (貼到 Zeabur APK_SHA256 環境變數) ==="
          keytool -list -v \
            -keystore app/release.keystore \
            -alias $KEY_ALIAS \
            -storepass $KS_PASS 2>/dev/null | grep "SHA256:"

      # ── 5. Build ───────────────────────────────────────────────
      - name: Build Release APK
        run: |
          $GRADLE :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.useAndroidX=true
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ env.KS_PASS }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASS }}

      # ── 6. 上傳 Artifact ───────────────────────────────────────
      - uses: actions/upload-artifact@v4
        with:
          name: DoReMi-KTV-v${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
