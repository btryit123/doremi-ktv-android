name: Build DoReMi APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 診斷：印出環境資訊 ─────────────────────────────────────
      - name: Diagnose environment
        run: |
          echo "=== Java ==="
          java -version
          echo "=== ANDROID_HOME ==="
          echo "${ANDROID_HOME:-NOT SET}"
          echo "${ANDROID_SDK_ROOT:-NOT SET}"
          echo "=== SDK dir ==="
          ls /usr/local/lib/android/sdk 2>/dev/null || echo "SDK dir not found at /usr/local/lib/android/sdk"
          ls /home/runner/android-sdk 2>/dev/null || true
          echo "=== sdkmanager ==="
          find /usr/local/lib/android -name sdkmanager 2>/dev/null | head -3
          echo "=== platforms ==="
          ls /usr/local/lib/android/sdk/platforms 2>/dev/null || echo "no platforms dir"
          echo "=== build-tools ==="
          ls /usr/local/lib/android/sdk/build-tools 2>/dev/null || echo "no build-tools dir"

      # ── Android SDK ────────────────────────────────────────────
      - name: Setup Android SDK
        run: |
          # 找出真正的 SDK 路徑
          SDK=""
          for path in \
            "/usr/local/lib/android/sdk" \
            "$ANDROID_HOME" \
            "$ANDROID_SDK_ROOT" \
            "/home/runner/android-sdk"; do
            if [ -d "$path/platforms" ] || [ -d "$path/platform-tools" ]; then
              SDK="$path"
              break
            fi
          done
          if [ -z "$SDK" ]; then
            echo "ERROR: Cannot find Android SDK" && exit 1
          fi
          echo "Found Android SDK at: $SDK"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "sdk.dir=$SDK" > local.properties
          # Install platform 34 if not present
          SDKMAN=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMAN" ]; then
            yes | "$SDKMAN" --licenses --sdk_root="$SDK" 2>/dev/null || true
            "$SDKMAN" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true
          fi

      # ── Gradle ────────────────────────────────────────────────
      - name: Download Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          chmod +x /tmp/gradle-8.4/bin/gradle
          echo "GRADLE_BIN=/tmp/gradle-8.4/bin/gradle" >> $GITHUB_ENV

      # ── Icons ─────────────────────────────────────────────────
      - name: Prepare icons
        run: |
          for d in mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p app/src/main/res/$d
          done
          curl -sf -o /tmp/icon.png https://btryit123.zeabur.app/icons/icon-512.png \
            || convert -size 192x192 xc:#9333ea /tmp/icon.png
          for d in mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp /tmp/icon.png app/src/main/res/$d/ic_launcher.png
            cp /tmp/icon.png app/src/main/res/$d/ic_launcher_round.png
          done

      # ── Keystore ──────────────────────────────────────────────
      - name: Prepare keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
            echo "KS_PASS=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"        >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.KEY_PASSWORD }}"      >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore app/release.keystore -alias doremi-ktv \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=DoReMi KTV, O=DoReMi, C=TW" \
              -storepass doremi123 -keypass doremi123 2>/dev/null
            echo "KS_PASS=doremi123"    >> $GITHUB_ENV
            echo "KEY_ALIAS=doremi-ktv" >> $GITHUB_ENV
            echo "KEY_PASS=doremi123"   >> $GITHUB_ENV
          fi

      - name: Print SHA-256 fingerprint
        run: |
          echo "=== SHA-256 (填入 Zeabur APK_SHA256) ==="
          keytool -list -v \
            -keystore app/release.keystore \
            -alias $KEY_ALIAS \
            -storepass $KS_PASS 2>/dev/null | grep "SHA256:" || echo "Cannot print fingerprint"

      # ── Build ─────────────────────────────────────────────────
      - name: Build Release APK
        run: |
          $GRADLE_BIN :app:assembleRelease \
            --no-daemon \
            --info \
            -Pandroid.useAndroidX=true
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ env.KS_PASS }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASS }}

      # ── Upload ────────────────────────────────────────────────
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DoReMi-KTV-v${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
