apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    namespace 'app.doremi.ktv'

    defaultConfig {
        applicationId "app.doremi.ktv"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "doremi123"
            keyAlias System.getenv("KEY_ALIAS") ?: "doremi-ktv"
            keyPassword System.getenv("KEY_PASSWORD") ?: "doremi123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
}
